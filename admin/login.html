<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin login — LPT Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css?v=3">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-card { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 40px; box-shadow: var(--shadow-md); }
  .login-card h1 { font-size: 1.4rem; margin: 14px 0 6px; }
  .login-card p { color: var(--ink-soft); font-size: 0.92rem; margin-bottom: 26px; }
</style>
</head>
<body>

  <div class="login-card">
    <span class="eyebrow">LPT Studio</span>
    <h1>Admin</h1>
    <p>Sign in to manage site content.</p>
    <form id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-accent" style="width:100%;">Sign in</button>
      <div class="form-status" role="status" aria-live="polite"></div>
    </form>
  </div>

  <script type="module" src="admin-login.js"></script>
</body>
</html>
